[package]
name = "hoist-cli"
version = "0.1.0"
edition = "2024"
description = "Upload and download files to cloud storage from the terminal"
license = "MIT"
repository = "https://github.com/shivendram16053/hoist"
keywords = ["cli", "google-drive", "upload", "cloud-storage"]
categories = ["command-line-utilities"]

[[bin]]
name = "hoist"
path = "src/main.rs"

[dependencies]
anyhow ="1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
dialoguer = { version = "0.12.0", features = ["fuzzy-select"] }
keyring = { version = "4.2.0", features = ["apple-native-keyring-store", "windows-native-keyring-store", "dbus-secret-service-keyring-store"] }
futures-util = "0.3"
indicatif = { version = "0.18.6", features = ["tokio"] }
reqwest = { version = "0.13.5", features = ["json", "multipart", "stream", "form", "query"] }
base64 = "0.22"
sha2 = "0.10"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio-util = { version = "0.7", features = ["io"] }
tokio = { version = "1.53.1", features = ["full"] }
url = "2.5.8"
urlencoding = "2.1.3"
webbrowser = "1.2.4"
